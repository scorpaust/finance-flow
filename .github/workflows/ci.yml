name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fase 8, ponto 6 / critério de aceitação — nenhum destes jobs precisa de
# segredos reais: os testes de integração arrancam o próprio MongoDB (em
# memória, via mongodb-memory-server) e um servidor HTTP local que finge a
# Anthropic/EasyPay/Twelve Data (tests/integration/stubProviders.ts) — nunca
# uma chamada real a um fornecedor externo nem ao MongoDB Atlas de produção.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Fase 9 — a dívida de 54 erros foi paga (tsconfig da raiz a apagar os
      # aliases do Nuxt, android/ incluído no type-check, casts de `$fetch`):
      # o type-check passa a falhar o job.
      - run: npm run type-check

  integration:
    name: Integration tests (servidor Nuxt real + Mongo em memória)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright — servidor Nuxt real + Mongo em memória)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
