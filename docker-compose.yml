version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: financeflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: financeflow
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: financeflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/financeflow
      APP_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
